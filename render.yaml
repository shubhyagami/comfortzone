services:
  - type: web
    name: project-lucid
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    envVars:
      - key: NVIDIA_API_KEY
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: NVIDIA_MODEL
        value: meta/llama-4-maverick-17b-128e-instruct
      - key: PYTHON_VERSION
        value: 3.11.0
