services:
  - type: web
    name: project-lucid
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    envVars:
      - key: NVIDIA_API_KEY
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: LUCY_MODEL
        value: google/gemma-3n-e4b-it
      - key: JOI_MODEL
        value: mistralai/mistral-nemotron
      - key: GHOST_MODEL
        value: meta/llama-3.1-8b-instruct
      - key: LUCIFER_MODEL
        value: deepseek-ai/deepseek-v4-flash
      - key: PYTHON_VERSION
        value: 3.11.0
